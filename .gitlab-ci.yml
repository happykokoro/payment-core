image: node:22-bookworm

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages: [verify]

variables:
  GIT_DEPTH: "0"

verify:
  stage: verify
  timeout: 15m
  script:
    - chown -R node:node "$CI_PROJECT_DIR"
    - runuser -u node -- bash scripts/ci.sh

secrets:
  stage: verify
  timeout: 5m
  script:
    - bash scripts/scan-secrets.sh
